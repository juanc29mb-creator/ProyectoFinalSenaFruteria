{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | El Paso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">
    <main class="login-page">
        <div class="login-container">
            <section class="login-card" aria-labelledby="login-title">
                <img class="login-logo" src="{% static 'img/team/logo.jpg' %}" alt="El Paso Mercado Campesino">
                <h1 class="login-title" id="login-title">Iniciar sesión</h1>
               

                {% if form.errors %}
                    <p class="login-error">Usuario o contraseña incorrectos.</p>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="login-button">Entrar</button>
                </form>
            </section>

            <div class="text-center">
                <a class="login-back" href="{% url 'inicio' %}">Volver al inicio</a>
            </div>
        </div>
    </main>
</body>
</html>
